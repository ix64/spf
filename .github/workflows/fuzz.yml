name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time to fuzz each target
        default: 2m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzCheck, FuzzReceivedSPF]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME" .

      # a failing input is saved under testdata/fuzz, add it there to reproduce
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-failure
          path: testdata/fuzz
